name: Debug probe 3
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Run trophy script with full output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          mkdir -p /tmp/tout
          python3 .github/scripts/generate_trophy.py Ashutosh-Panda2004 /tmp/tout/trophy.svg tokyonight > /tmp/tout/out.txt 2>&1
          echo "EXIT=$?" >> /tmp/tout/out.txt
          ls -la /tmp/tout/ >> /tmp/tout/out.txt 2>&1
          BODY=$(cat /tmp/tout/out.txt)
          python3 -c "import json,sys; print(json.dumps({'title':'[debug] probe3','body':sys.argv[1][:6000]}))" "$BODY" > /tmp/issue.json
          curl -s -m 30 -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -d @/tmp/issue.json https://api.github.com/repos/Ashutosh-Panda2004/Ashutosh-Panda2004/issues | head -c 100
