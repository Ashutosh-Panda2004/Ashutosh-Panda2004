name: Debug probe 2
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Probe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          echo "TOKEN_LEN=${#GITHUB_TOKEN}" > /tmp/p.txt
          echo "PY_TOKEN_SET=$(python3 -c 'import os; print(bool(os.environ.get("GITHUB_TOKEN")))')" >> /tmp/p.txt
          echo "REST_HTTP=$(curl -s -m 20 -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/user)" >> /tmp/p.txt
          echo "GQL_HTTP=$(curl -s -m 20 -o /tmp/g.json -w "%{http_code}" -X POST https://api.github.com/graphql -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -d '{\"query\":\"{ viewer { login } }\"}')" >> /tmp/p.txt
          echo "GQL_BODY=$(head -c 300 /tmp/g.json)" >> /tmp/p.txt
          echo "PY_GQL=$(python3 -c 'import os,json,urllib.request; t=os.environ.get("GITHUB_TOKEN"); q=urllib.request.Request("https://api.github.com/graphql", data=json.dumps({"query":"{ viewer { login }"}).encode(), headers={"Authorization":"Bearer "+t,"Content-Type":"application/json"}); print(urllib.request.urlopen(q,timeout=30).status)' 2>&1)" >> /tmp/p.txt
          BODY=$(cat /tmp/p.txt)
          python3 -c "import json,sys; print(json.dumps({'title':'[debug] probe2','body':sys.argv[1]}))" "$BODY" > /tmp/issue.json
          curl -s -m 30 -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -d @/tmp/issue.json https://api.github.com/repos/Ashutosh-Panda2004/Ashutosh-Panda2004/issues | head -c 200
