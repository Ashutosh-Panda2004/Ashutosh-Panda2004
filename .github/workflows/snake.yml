name: Generate profile widgets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: Ashutosh-Panda2004
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate trophy showcase
        run: |
          set +e
          {
            echo "== python =="; python3 --version
            echo "== scripts =="; ls -la .github/scripts/
            echo "== token empty? =="; if [ -z "$GITHUB_TOKEN" ]; then echo "TOKEN EMPTY"; else echo "token present, len=${#GITHUB_TOKEN}"; fi
            echo "== graphql probe =="
            curl -s -m 20 -o /tmp/probe.json -w "http=%{http_code}\n" -X POST https://api.github.com/graphql \
              -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" \
              -d '{"query":"{ viewer { login } }"}' || echo "curl failed"
            head -c 300 /tmp/probe.json; echo
            echo "== generator =="
            python3 .github/scripts/generate_trophy.py Ashutosh-Panda2004 dist/trophy.svg tokyonight
            echo "generator exit=$?"
          } > dist/trophy-debug.txt 2>&1
          cat dist/trophy-debug.txt
          exit 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: Ashutosh-Panda2004
          options: theme=tokyo-night&hide_border=true&bg_color=0D1117&color=00F5FF&line=00F5FF&point=FFFFFF
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
