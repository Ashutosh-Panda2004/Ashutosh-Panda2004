  <text x="24" y="104" font-size="11.5" fill="#c9d1d9">Terminates your service the way</text><text x="24" y="120" font-size="11.5" fill="#c9d1d9">your orchestrator will, under real</text><text x="24" y="136" font-size="11.5" fill="#c9d1d9">load. A 7-stage termination model</text><text x="24" y="152" font-size="11.5" fill="#c9d1d9">with named findings and</text><text x="24" y="168" font-size="11.5" fill="#c9d1d9">deterministic scoring.</text>
